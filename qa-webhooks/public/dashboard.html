<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ConvoFlow — Nova / Aurora Dental — Live QA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F0F1A; --panel:#141421; --panel2:#1C1C2E; --border:#2A2A3D;
    --text:#FFFFFF; --sub:#9CA3AF; --muted:#6B7280;
    --pink:#EC4899; --pink2:#F472B6;
    --green:#16A34A; --greenBg:rgba(22,163,74,.14);
    --red:#EF4444; --redBg:rgba(239,68,68,.14);
    --amber:#F59E0B; --amberBg:rgba(245,158,11,.14);
    --blue:#3B82F6; --blueBg:rgba(59,130,246,.14);
    --gray:#6B7280; --grayBg:rgba(107,114,128,.16);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;font-size:14px;
    padding:20px 22px 60px;padding-top:calc(20px + env(safe-area-inset-top,0px));}
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:1180px;margin:0 auto;}

  .headline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .brand{font-size:19px;font-weight:700;}
  .brand span{color:var(--pink);}
  .badge-live{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--greenBg);color:#86EFAC;display:inline-flex;align-items:center;gap:6px;}
  .dot-pulse{width:6px;height:6px;border-radius:999px;background:#86EFAC;animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  @keyframes slideIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes flashRow{0%{background:rgba(236,72,153,.18);}100%{background:transparent;}}

  .agentbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px;padding:14px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--border);}
  .avatar{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--pink),var(--pink2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 38px;}
  .agentmeta .name{font-weight:700;font-size:15px;}
  .agentmeta .sub{font-size:12.5px;color:var(--muted);margin-top:1px;}
  .refreshbtn{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .iconbtn{width:32px;height:32px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);}
  .iconbtn:hover{color:var(--text);}
  .lastupdated{font-size:11.5px;color:var(--muted);}

  .kpirow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px;}
  .kpi{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:13px 15px;}
  .kpi .kl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .kpi .kv{font-family:'JetBrains Mono',monospace;font-size:23px;font-weight:600;margin-top:5px;}
  @media(max-width:760px){.kpirow{grid-template-columns:repeat(2,1fr);}}

  .toolsrow{margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .chip{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--sub);}
  .chip.on{background:rgba(236,72,153,.15);color:var(--pink2);border-color:rgba(236,72,153,.4);}
  input#search{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:8px 14px;color:#fff;font-size:13px;outline:none;min-width:180px;}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;font-weight:600;font-size:12.5px;cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);}
  .btn.primary{background:var(--pink);border-color:var(--pink);color:#fff;}

  .card{border:1px solid var(--border);border-radius:14px;background:var(--panel);overflow:hidden;margin-top:14px;}
  .trow{display:grid;grid-template-columns:150px 2fr .8fr 1fr 1fr .7fr;gap:10px;padding:13px 16px;align-items:center;border-bottom:1px solid #1C1C2E;cursor:pointer;font-size:13px;border-left:3px solid transparent;}
  .trow.head{cursor:default;background:var(--panel2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:700;border-left:none;}
  .trow:hover:not(.head){background:#171726;}
  .newbadge{font-size:9.5px;font-weight:800;letter-spacing:.04em;background:var(--pink);color:#fff;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:middle;}
  .sevbadge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .statusbadge{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;}
  .assignlist{margin-top:8px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#0F0F1A;}
  .assignrow{padding:9px 12px;cursor:pointer;}
  .assignrow:hover{background:var(--panel2);}
  .detail{padding:16px 20px 20px;background:#0F0F1A;border-top:1px solid #1C1C2E;font-size:13px;}
  .detail b{color:var(--sub);}
  .empty{padding:40px 20px;text-align:center;color:var(--muted);}
  .transcriptbox{margin-top:12px;border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--panel);max-height:260px;overflow:auto;}
  .tline{display:grid;grid-template-columns:44px 1fr;gap:10px;font-size:12.5px;margin-bottom:5px;}
  .tline .who{color:var(--pink2);font-family:'JetBrains Mono',monospace;font-size:11px;}
  .tline.user .who{color:var(--muted);}

  .toaststack{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:18px;display:flex;flex-direction:column;gap:8px;z-index:80;}
  .toast{background:#141421;border:1px solid var(--border);border-radius:10px;padding:11px 15px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:slideIn .18s ease;max-width:300px;}
  .footerhint{margin-top:22px;text-align:center;font-size:11.5px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <div class="headline">
    <div class="brand">Convo<span>Flow</span></div>
    <span class="badge-live"><span class="dot-pulse"></span>Connected to real backend</span>
  </div>

  <div class="agentbar">
    <div class="avatar">N</div>
    <div class="agentmeta">
      <div class="name">Nova — Aurora Dental Group</div>
      <div class="sub">Voice QA · rule-based analysis on every real call</div>
    </div>
    <div class="refreshbtn">
      <span class="lastupdated" id="lastupdated"></span>
      <div class="iconbtn" onclick="loadTickets()" title="Refresh now">⟳</div>
    </div>
  </div>

  <div class="card" style="padding:16px 18px" id="calltest-card">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div style="flex:1;min-width:200px">
        <div style="font-weight:700;font-size:14px">Live test call</div>
        <div style="color:var(--sub);font-size:12.5px;margin-top:2px" id="callstatus">
          Click to start a real voice call with Nova, right in your browser.
        </div>
      </div>
      <div class="btn primary" id="callbtn" onclick="toggleCall()">Start test call</div>
    </div>
    <div id="calltranscript" style="margin-top:12px;display:none;max-height:180px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#0F0F1A;font-size:12.5px"></div>
  </div>

  <div class="kpirow" id="kpirow"></div>

  <div class="toolsrow">
    <div id="filters" style="display:flex;gap:8px;flex-wrap:wrap;flex:1"></div>
    <input id="search" placeholder="Search tickets…" oninput="onSearch(this.value)">
    <div class="btn" onclick="exportCSV()">Export CSV</div>
  </div>

  <div class="card" id="table"></div>
  <div class="footerhint">Auto-refreshes every 10s · click a row for full transcript</div>
</div>
<div class="toaststack" id="toasts"></div>

<script>
const TEAM = [
  { id:'priya', name:'Priya N.' },
  { id:'diego', name:'Diego R.' },
  { id:'mei',   name:'Mei L.' },
];
const SEV = {
  Blocker:{bg:'var(--redBg)', color:'#FCA5A5', border:'var(--red)'},
  Major:{bg:'var(--amberBg)', color:'#FCD34D', border:'var(--amber)'},
  Minor:{bg:'var(--grayBg)', color:'#D1D5DB', border:'var(--gray)'}
};
const STATUS_COLOR = {
  Unassigned:{bg:'var(--grayBg)', color:'#D1D5DB'},
  Open:{bg:'rgba(236,72,153,.15)', color:'#F9A8D4'},
  'In Progress':{bg:'var(--blueBg)', color:'#93C5FD'},
  Fixed:{bg:'var(--amberBg)', color:'#FCD34D'},
  Verified:{bg:'var(--greenBg)', color:'#86EFAC'},
  Reopened:{bg:'var(--redBg)', color:'#FCA5A5'}
};

let tickets = [];
let stats = { callsTotal: 0, callsClean: 0 };
let filter = 'All';
let search = '';
let expanded = null;
let assignOpenFor = null;
let knownIds = new Set();
let toastQueue = [];

function toast(msg){
  const id = Math.random().toString(36).slice(2);
  toastQueue.push({id, msg});
  renderToasts();
  setTimeout(()=>{ toastQueue = toastQueue.filter(t=>t.id!==id); renderToasts(); }, 3400);
}
function renderToasts(){
  document.getElementById('toasts').innerHTML = toastQueue.map(t=>`<div class="toast">${t.msg}</div>`).join('');
}

function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<10) return 'just now';
  if(s<60) return s+'s ago';
  const m = Math.floor(s/60); if(m<60) return m+'m ago';
  const h = Math.floor(m/60); return h+'h ago';
}

async function loadTickets(){
  try {
    const res = await fetch('/api/tickets');
    const data = await res.json();
    const newTickets = data.tickets || [];
    stats = data.stats || stats;

    const newIds = newTickets.map(t=>t.id).filter(id => !knownIds.has(id));
    if (newIds.length > 0 && knownIds.size > 0) {
      toast(newIds.length + ' new ticket' + (newIds.length===1?'':'s') + ' just came in from a real call.');
    }
    newTickets.forEach(t => knownIds.add(t.id));

    tickets = newTickets;
    document.getElementById('lastupdated').textContent = 'updated ' + timeAgo(Date.now());
  } catch(e){
    document.getElementById('lastupdated').textContent = 'could not reach /api/tickets';
    console.error(e);
  }
  render();
}

async function patchTicket(id, patch){
  await fetch('/api/tickets', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, ...patch })
  });
  await loadTickets();
}

function filtered(){
  let list = filter === 'All' ? tickets : tickets.filter(t => t.status === filter);
  if (search.trim()) {
    const q = search.toLowerCase();
    list = list.filter(t => (t.issue+t.category+(t.assignee||'')).toLowerCase().includes(q));
  }
  return list;
}

function setFilter(s){ filter = s; render(); }
function onSearch(v){ search = v; renderTable(); }
function toggleExpand(id){ expanded = expanded===id ? null : id; render(); }
function toggleAssign(id){ assignOpenFor = assignOpenFor===id ? null : id; render(); }

function assigneeCell(t){
  if (t.assignee && assignOpenFor !== t.id) {
    return `<span onclick="event.stopPropagation();toggleAssign('${t.id}')" style="cursor:pointer">${t.assignee}</span>`;
  }
  if (assignOpenFor === t.id) {
    return `<div onclick="event.stopPropagation()">
      <div class="btn" style="padding:5px 10px;font-size:11px" onclick="toggleAssign('${t.id}')">Cancel</div>
      <div class="assignlist">
        ${TEAM.map(p => `<div class="assignrow" onclick="assignTo('${t.id}','${p.name}')">${p.name}</div>`).join('')}
      </div>
    </div>`;
  }
  return `<div class="btn primary" style="padding:5px 12px;font-size:11.5px" onclick="event.stopPropagation();toggleAssign('${t.id}')">Assign</div>`;
}

function assignTo(id, name){
  assignOpenFor = null;
  patchTicket(id, { assignee: name, status: 'Open' });
  toast(id + ' assigned to ' + name + '.');
}

function actionButtons(t){
  const b = (label, status) => `<div class="btn" onclick="event.stopPropagation();patchTicket('${t.id}',{status:'${status}'});toast('${t.id} marked ${status}.')">${label}</div>`;
  if (t.status === 'Unassigned') return `<span style="color:var(--muted);font-size:12.5px">Assign before work can start.</span>`;
  if (t.status === 'Open') return b('Start progress', 'In Progress');
  if (t.status === 'In Progress') return b('Mark fixed', 'Fixed');
  if (t.status === 'Fixed') return b('Verify — pass', 'Verified') + ' ' + b('Verify — fail', 'Reopened');
  if (t.status === 'Reopened') return b('Start progress', 'In Progress');
  return `<span style="color:var(--muted);font-size:12.5px">Verified — no further action.</span>`;
}

function parseTranscript(transcript){
  if(!transcript) return [];
  return transcript.split('\n').filter(Boolean).map(line=>{
    const m = line.match(/^(AI|User):\s?(.*)$/);
    return m ? {who:m[1], text:m[2]} : null;
  }).filter(Boolean);
}

function renderKpis(){
  const total = stats.callsTotal || 0;
  const clean = stats.callsClean || 0;
  const passRate = total ? Math.round(100*clean/total) : null;
  const openBlockers = tickets.filter(t=>t.severity==='Blocker' && t.status!=='Verified').length;
  document.getElementById('kpirow').innerHTML = `
    <div class="kpi"><div class="kl">Calls tested</div><div class="kv">${total}</div></div>
    <div class="kpi"><div class="kl">Pass rate</div><div class="kv" style="color:${passRate===null?'var(--sub)':(passRate>=80?'var(--green)':'var(--red)')}">${passRate===null?'—':passRate+'%'}</div></div>
    <div class="kpi"><div class="kl">Tickets logged</div><div class="kv">${tickets.length}</div></div>
    <div class="kpi"><div class="kl">Open blockers</div><div class="kv" style="color:${openBlockers>0?'var(--red)':'var(--green)'}">${openBlockers}</div></div>
  `;
}

function render(){
  const statuses = ['All','Unassigned','Open','In Progress','Fixed','Verified','Reopened'];
  document.getElementById('filters').innerHTML = statuses.map(s => {
    const n = s === 'All' ? tickets.length : tickets.filter(t=>t.status===s).length;
    return `<div class="chip ${filter===s?'on':''}" onclick="setFilter('${s}')">${s} ${n}</div>`;
  }).join('');
  renderKpis();
  renderTable();
}

function renderTable(){
  const rows = filtered();
  const head = `<div class="trow head"><div>ID</div><div>Issue</div><div>Severity</div><div>Assignee</div><div>Status</div><div>Retests</div></div>`;
  if (rows.length === 0) {
    document.getElementById('table').innerHTML = head + `<div class="empty">No tickets in this view. Make a test call in VAPI — a clean call won't create one, an issue will show up here within 10 seconds.</div>`;
    return;
  }
  document.getElementById('table').innerHTML = head + rows.map(t => {
    const sc = STATUS_COLOR[t.status];
    const sv = SEV[t.severity];
    const open = expanded === t.id;
    const isNew = (Date.now() - t.createdAt) < 120000;
    return `<div>
      <div class="trow" style="border-left-color:${sv.border}" onclick="toggleExpand('${t.id}')">
        <div class="mono">${t.id.slice(0,18)}${isNew?'<span class="newbadge">NEW</span>':''}</div>
        <div>${t.issue}</div>
        <div><span class="sevbadge" style="background:${sv.bg};color:${sv.color}">${t.severity}</span></div>
        <div>${assigneeCell(t)}</div>
        <div><span class="statusbadge" style="background:${sc.bg};color:${sc.color}">${t.status}</span></div>
        <div class="mono" style="color:var(--sub)">${t.retests}</div>
      </div>
      ${open ? `<div class="detail">
        <div><b>Expected:</b> ${t.expected}</div>
        <div style="margin-top:6px"><b>Actual:</b> ${t.actual}</div>
        <div style="margin-top:6px"><b>Tester note:</b> ${t.testerNote || '—'}</div>
        <div style="margin-top:6px;font-size:11.5px;color:var(--muted)">Logged ${timeAgo(t.createdAt)}</div>
        <div class="transcriptbox">
          ${parseTranscript(t.transcript).map(l=>`<div class="tline ${l.who==='User'?'user':''}"><span class="who">${l.who}</span><span>${l.text}</span></div>`).join('') || '<span style="color:var(--muted)">No transcript available.</span>'}
        </div>
        <div style="margin-top:12px">${actionButtons(t)}</div>
      </div>` : ''}
    </div>`;
  }).join('');
}

function exportCSV(){
  const rows = [['ID','Issue','Category','Severity','Assignee','Status','Retests']];
  filtered().forEach(t=> rows.push([t.id,t.issue,t.category,t.severity,t.assignee||'',t.status,t.retests]));
  const csv = rows.map(r=> r.map(c=> '"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='convoflow-live-tickets.csv'; a.click();
  URL.revokeObjectURL(url);
}

loadTickets();
setInterval(loadTickets, 10000);
setInterval(()=>{ document.getElementById('lastupdated').textContent = 'updated just now'; }, 10000);
</script>

<script type="module">
  // Uses VAPI's raw Web SDK (not the pre-built floating widget, which
  // doesn't support inline placement and hides real errors behind a
  // generic icon). Loaded via jsdelivr's /+esm endpoint, which serves any
  // npm package as a browser-ready ES module — no bundler needed.
  //
  // The SDK's default export shape can vary depending on how jsdelivr's
  // CJS→ESM conversion wraps it, so we defensively check a few
  // possibilities instead of assuming one. Everything is wrapped in
  // try/catch so a load failure shows a real message instead of silently
  // breaking the rest of the page's scripts.

  const VAPI_PUBLIC_KEY = '2c4e5a0b-ce2d-4450-a959-f2631aaded4a';
  const VAPI_ASSISTANT_ID = '6e6a7b93-e119-451e-a038-8599a821f90c'; // Nova

  const statusEl = document.getElementById('callstatus');
  const btnEl = document.getElementById('callbtn');
  const transcriptEl = document.getElementById('calltranscript');

  function setStatus(text){ statusEl.textContent = text; }
  function resetButton(){
    btnEl.textContent = 'Start test call';
    btnEl.style.opacity = '1';
    btnEl.style.pointerEvents = 'auto';
  }

  let vapi = null;
  let isCallActive = false;

  window.toggleCall = function(){
    if (!vapi) {
      setStatus('Voice SDK did not load — check the browser console for the exact error.');
      return;
    }
    if (isCallActive) {
      vapi.stop();
      return;
    }
    transcriptEl.style.display = 'block';
    transcriptEl.innerHTML = '';
    setStatus('Connecting… (your browser may ask for microphone permission)');
    btnEl.style.opacity = '.6';
    btnEl.style.pointerEvents = 'none';
    vapi.start(VAPI_ASSISTANT_ID);
  };

  try {
    const mod = await import('https://cdn.jsdelivr.net/npm/@vapi-ai/web@2.1.8/+esm');
    const VapiClass = mod.default || mod.Vapi || mod;
    vapi = new VapiClass(VAPI_PUBLIC_KEY);

    vapi.on('call-start', () => {
      isCallActive = true;
      setStatus('Call connected — talk to Nova now.');
      btnEl.textContent = 'End call';
      btnEl.style.opacity = '1';
      btnEl.style.pointerEvents = 'auto';
    });

    vapi.on('call-end', () => {
      isCallActive = false;
      setStatus('Call ended — check Tickets below in about 10 seconds.');
      resetButton();
    });

    vapi.on('error', (err) => {
      isCallActive = false;
      console.error('[vapi] call error:', err);
      const msg = (err && (err.message || err.errorMsg || err.type)) || 'Unknown error — check the browser console.';
      setStatus('Call failed: ' + msg);
      resetButton();
    });

    vapi.on('message', (message) => {
      if (message.type === 'transcript' && message.transcriptType === 'final') {
        const line = document.createElement('div');
        line.style.marginBottom = '4px';
        line.innerHTML = '<span style="color:var(--pink2);font-family:\'JetBrains Mono\',monospace;font-size:11px">' +
          (message.role === 'assistant' ? 'AI' : 'User') + '</span> &nbsp;' + message.transcript;
        transcriptEl.appendChild(line);
        transcriptEl.scrollTop = transcriptEl.scrollHeight;
      }
    });

    setStatus('Click to start a real voice call with Nova, right in your browser.');
  } catch (err) {
    console.error('[vapi] failed to load SDK:', err);
    setStatus('Voice SDK failed to load: ' + (err && err.message ? err.message : String(err)) + ' — see console for full details.');
  }
</script>
</body>
</html>
